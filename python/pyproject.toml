[project]
name = "dot-socp-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.8.1",
    "matplotlib>=3.10.7",
    "numexpr>=2.14.1",
    "numpy>=2.3.5",
    "scipy>=1.16.3",
    "setuptools>=80.9.0",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["dotsocp*"]

[tool.setuptools.package-data]
dotsocp = ["presets/resources/**/*"]

[project.scripts]
dotsocp = "dotsocp.cli:main"

[dependency-groups]
notebook = [
    "ipykernel>=7.1.0",
    "ipympl>=0.9.8",
    "jupyterlab>=4.5.1",
    "nbformat>=5.10.4",
]
